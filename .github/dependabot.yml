# Weekly proposals to move the pinned workflow actions (the SHA moves with the version in its
# comment). Minor and patch bumps come grouped; majors come on their own. The library's own
# dependencies are ranges in library.properties and library.json, which no ecosystem here reads.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
