name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    # The checks the Arduino Library Manager runs on a new release of a listed library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arduino/arduino-lint-action@4de5fc895deecbda2f6b1cc05de7a8fdd5c4c51f # v2.0.0
        with:
          library-manager: update
      - name: The three version strings agree
        run: ./scripts/check-version.sh

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch ArduinoJson
        run: git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson test/host/ArduinoJson
      - name: Protocol logic (frames, times, outbox, backoff)
        run: make -C test/host

  conformance:
    # The client protocol checklist (Tests/Conformance in wbskt/Wbskt), run against WbsktClient
    # built for Linux over the shims in test/conformance/shim.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: wbskt/Wbskt
          path: wbskt
          sparse-checkout: Tests/Conformance
      - name: Fetch ArduinoJson
        run: git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson test/host/ArduinoJson
      - name: Build the harness
        run: make -C test/conformance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Run the suite, and this SDK's own scenarios with its fixtures
        working-directory: wbskt/Tests/Conformance
        run: |
          pip install -r requirements.txt
          cp "$GITHUB_WORKSPACE/test/conformance/test_esp32.py" .
          WBSKT_HARNESS="$GITHUB_WORKSPACE/test/conformance/wbskt-harness" python -m pytest -v

  compile:
    # compile-sketches pins Python 3.12.4, which setup-python has no build of for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # WiFi + TLS outgrow the default 1.2 MB app partition; min_spiffs gives 1.9 MB and keeps OTA.
        fqbn:
          - esp32:esp32:esp32:PartitionScheme=min_spiffs
          - esp32:esp32:esp32s3:PartitionScheme=min_spiffs
          - esp32:esp32:esp32c3:PartitionScheme=min_spiffs
        deps: [newest]
        # The oldest versions library.properties and library.json accept, so the floors they claim
        # are built and not only the newest releases.
        include:
          - fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
            deps: floors
            arduinojson: '7.0.0'
            websockets: '2.6.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arduino/compile-sketches@3f3921bad94c706a153e6d7294445b49d7f76a63 # v1.1.4
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
            - name: ArduinoJson
              version: ${{ matrix.arduinojson || 'latest' }}
            - name: WebSockets
              version: ${{ matrix.websockets || 'latest' }}
          sketch-paths: |
            - examples
          cli-compile-flags: |
            - --warnings
            - default

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Pack the library as the registry would take it
        run: pio pkg pack -o "$RUNNER_TEMP"
      - name: Build the examples
        run: |
          for example in examples/*/; do
            pio ci "$example" --lib . --board esp32dev \
              --project-option "lib_deps=bblanchon/ArduinoJson@^7.0.0, links2004/WebSockets@^2.6.0" \
              --project-option "board_build.partitions=min_spiffs.csv"
          done
