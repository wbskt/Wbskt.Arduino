name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ArduinoJson
        run: git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson test/host/ArduinoJson
      - name: Protocol logic (frames, times, outbox, backoff)
        run: make -C test/host

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WiFi + TLS outgrow the default 1.2 MB app partition; min_spiffs gives 1.9 MB and keeps OTA.
        fqbn:
          - esp32:esp32:esp32:PartitionScheme=min_spiffs
          - esp32:esp32:esp32s3:PartitionScheme=min_spiffs
          - esp32:esp32:esp32c3:PartitionScheme=min_spiffs
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
            - name: ArduinoJson
            - name: WebSockets
          sketch-paths: |
            - examples
          cli-compile-flags: |
            - --warnings
            - default

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Build the examples
        run: |
          for example in examples/*/; do
            pio ci "$example" --lib . --board esp32dev \
              --project-option "lib_deps=bblanchon/ArduinoJson@^7.0.0, links2004/WebSockets@^2.6.0" \
              --project-option "board_build.partitions=min_spiffs.csv"
          done
